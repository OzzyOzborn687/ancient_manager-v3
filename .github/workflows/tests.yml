name: Simulation tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-results
          path: test-results/

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Inspect all screens and tournament formats
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/ancient-http.log 2>&1 &
          node tests/browser/neon.cjs
          node tests/browser/ti-festival.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: |
            test-results/browser-neon/
            test-results/browser-ti-festival/
