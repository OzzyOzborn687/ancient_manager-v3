name: Simulation tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESULTS_DIR: /tmp/ancient-manager-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-results
          path: /tmp/ancient-manager-tests/

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Inspect all screens and tournament formats
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/ancient-http.log 2>&1 &
          BROWSER_RESULTS_DIR=/tmp/ancient-manager-browser/sponsors4a node tests/browser/sponsors4a.cjs
          BROWSER_RESULTS_DIR=/tmp/ancient-manager-browser/v4 node tests/browser/v4.cjs
          BROWSER_RESULTS_DIR=/tmp/ancient-manager-browser/arena33c node tests/browser/arena33c.cjs
          node tests/browser/draft-update.cjs
          BROWSER_RESULTS_DIR=/tmp/ancient-manager-browser/neon node tests/browser/neon.cjs
          BROWSER_RESULTS_DIR=/tmp/ancient-manager-browser/ti-festival node tests/browser/ti-festival.cjs
          BROWSER_RESULTS_DIR=/tmp/ancient-manager-browser/qualifiers node tests/browser/qualifiers.cjs
          BROWSER_RESULTS_DIR=/tmp/ancient-manager-browser/qualifiers-scene node tests/browser/qualifiers-scene.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: |
            /tmp/ancient-manager-browser/
