name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game
        run: |
          unzip -q ./*.zip
          ls Ancient-Manager-v2.1/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Ancient-Manager-v2.1/dist
      - uses: actions/deploy-pages@v4
